name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  LOGO_URL: https://i.ibb.co.com/4n0LPmHB/New-Project-DF44-C5-B.png
  ICON_BG: "#ffffff"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Prepare app icon
        run: |
          mkdir -p assets
          if [ -f assets/logo.png ]; then
            cp assets/logo.png logo-src.png
          else
            curl -fL -A "Mozilla/5.0" -o logo-src.png "$LOGO_URL"
          fi
          identify logo-src.png
          convert logo-src.png -resize 900x900 -background "$ICON_BG" -gravity center -extent 1024x1024 -alpha remove -alpha off assets/icon-only.png
          convert logo-src.png -resize 660x660 -background none -gravity center -extent 1024x1024 assets/icon-foreground.png
          convert -size 1024x1024 xc:"$ICON_BG" assets/icon-background.png
          npm install --no-save @capacitor/assets@3
          npx capacitor-assets generate --android

      - name: Generate app icon from logo
        run: |
          mkdir -p assets
          if [ ! -f assets/icon.png ]; then
            curl -fL "https://i.ibb.co.com/4n0LPmHB/New-Project-DF44-C5-B.png" -o logo.png
            convert logo.png -background none -gravity center -resize 760x760 -extent 1024x1024 assets/icon.png
          fi
          npx @capacitor/assets generate --android --iconBackgroundColor "#0d0f13" --iconBackgroundColorDark "#0d0f13"

      - name: Generate app icons
        env:
          LOGO_URL: https://i.ibb.co.com/Psbmh1M0/file-00000000c1ac82119c142444655f4aca.png
          ICON_BG: "#FFFFFF"
        run: |
          mkdir -p assets
          if [ ! -f assets/logo.png ]; then
            curl -fL --retry 3 -A "Mozilla/5.0" "$LOGO_URL" -o assets/logo.png
          fi
          file assets/logo.png
          # full icon (legacy/round icons)
          convert assets/logo.png -background none -gravity center -resize 1024x1024 -extent 1024x1024 assets/icon-only.png
          # adaptive foreground with safe-zone padding
          convert assets/logo.png -background none -gravity center -resize 640x640 -extent 1024x1024 assets/icon-foreground.png
          npx @capacitor/assets generate --android --iconBackgroundColor "$ICON_BG" --iconBackgroundColorDark "$ICON_BG"

      - name: Add camera permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' $MANIFEST
          grep -n "CAMERA" $MANIFEST

      - name: Sync web files
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -v -keystore scanora.jks -alias scanora \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass scanora123 -keypass scanora123 \
            -dname "CN=Scanora, O=Scanora, C=BD"
          $BT/zipalign -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks scanora.jks --ks-pass pass:scanora123 \
            --key-pass pass:scanora123 --out release.apk aligned.apk

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Scanora v${{ github.run_number }}
          files: release.apk
